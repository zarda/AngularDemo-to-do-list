<mat-toolbar></mat-toolbar>
@for (key of listDataService.keys; track key) {
    <mat-toolbar [color]="listDataService.getIsCompleted(key) ? 'accent':'warn'">
        <mat-checkbox
            class="icon-pad"
            aria-label="A checkbox | display whether the task has completed."
            [checked]="listDataService.getIsCompleted(key)"
            (change)="checkCompleted(key)"
            >
        </mat-checkbox>
        <input
            type="text"
            matInput
            class="width-full"
            placeholder="Task description"
            aria-label="An input | display the description of a task."
            [value]="listDataService.getDescription(key)"
            (change)="listDataService.setDescription(key, $any($event.target).value)"
            >
        <span class="spacer"></span>
        <button
            mat-icon-button
            class="icon-pad"
            aria-label="A button | delete this task."
            (click)="onDeleteByKey(key)"
            >
            <mat-icon>delete</mat-icon>
        </button>
    </mat-toolbar>
}
